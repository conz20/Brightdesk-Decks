<!doctype html>
<html lang="en-AU">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brightdesk Decks — Presentation</title>

<body>

          <p id="audience-body-secondary" class="audience-body-secondary" hidden></p>

      <div class="audience-object-layer" aria-hidden="true"></div>

  </main>
  <script src="presentation-window.js"></script>
